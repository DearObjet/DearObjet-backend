spring:
  application:
    name: backend

  profiles:
    active: prod # 인증인가가 필요하다면 prod로 변경

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/dearobjet
    username: dearobjet
    password: dearobjet1234

  jpa:
    hibernate:
      ddl-auto: update # update로 수정해야함
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            scope:
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1시간(ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

nts:
  api:
    service-key: ${NTS_SERVICE_KEY}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  from-number: ${SOLAPI_FROM_NUMBER}

cloud:
  aws:
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}

toss:
  secretKey: ${TOSS_SECRET_KEY:}
  clientKey: ${TOSS_CLIENT_KEY:}
  apiBase: ${TOSS_API_BASE:https://api.tosspayments.com}